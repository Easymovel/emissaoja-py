# Publica no PyPI quando uma tag v* é enviada (ex.: git tag v0.1.0 && git push origin v0.1.0).
#
# Trusted publishing (OIDC), sem token guardado. Configuração única, com a conta da empresa no pypi.org:
#   Your account > Publishing > "Add a new pending publisher" > GitHub:
#     PyPI Project Name: emissaoja · Owner: Easymovel · Repository name: emissaoja-py
#     Workflow name: publicar.yml · Environment name: pypi
# O pending publisher cria o projeto na primeira publicação. Depois, cada tag nova publica sozinha.
name: Publicar no PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # o ubuntu-latest (26.04) não tem mais o Python 3.9
          - python: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Conferir que a tag bate com a versão
        run: |
          versao=$(cd src && python -c "import emissaoja; print(emissaoja.__version__)")
          projeto=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" 2>/dev/null || echo "$versao")
          echo "tag ${GITHUB_REF_NAME}, __version__ ${versao}, pyproject ${projeto}"
          if [ "${GITHUB_REF_NAME}" != "v${versao}" ] || [ "${versao}" != "${projeto}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com a versão do pacote"
            exit 1
          fi
      - run: python -m unittest discover -s tests -v

  publicar:
    name: Construir e publicar
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emissaoja/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir sdist e wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Publicar no PyPI (trusted publishing, sem token)
        uses: pypa/gh-action-pypi-publish@release/v1
