name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # o ubuntu-latest (26.04) não tem mais o Python 3.9
          - python: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes (sem rede)
        run: python -m unittest discover -s tests -v
      - name: Instalar o pacote
        run: python -m pip install .
      - name: Importar o pacote instalado
        run: cd /tmp && python -c "import emissaoja; print(emissaoja.__version__, emissaoja.BASE_SANDBOX)"

  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
